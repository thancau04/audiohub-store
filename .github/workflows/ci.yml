name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: audiohub
          POSTGRES_PASSWORD: audiohub_ci_password
          POSTGRES_DB: audiohub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài đặt phụ thuộc
        run: npm ci

      - name: Kiểm tra cú pháp JavaScript
        run: |
          node --check server.js
          for f in db/*.js src/*.js src/routes/*.js scripts/*.js tests/*.js; do
            node --check "$f"
          done

      - name: Khởi tạo DB kiểm thử và chạy test tích hợp
        env:
          DATABASE_URL: postgresql://audiohub:audiohub_ci_password@localhost:5432/audiohub_test
          DB_SSL: "false"
          SESSION_SECRET: ci-test-session-secret
        run: |
          npm run db:init
          npm test
